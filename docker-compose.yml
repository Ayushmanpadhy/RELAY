services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: relay-cluster
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      - DATA_DIR=/data
    volumes:
      - relay_data:/data

volumes:
  relay_data:
