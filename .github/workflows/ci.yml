name: Relay CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      run_live_tests:
        description: 'Run live AI provider integration tests'
        required: false
        default: 'false'

jobs:
  backend-quality:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install ruff mypy pytest pytest-asyncio httpx hypothesis pip-audit

      - name: Run Ruff Linter & Format Check
        run: |
          ruff check app
          ruff format --check app

      - name: Run Mypy Strict Type Check
        run: |
          mypy app

      - name: Run Pytest Test Suite
        env:
          RELAY_FAKE_PROVIDERS: 0
          APP_ENV: test
        run: |
          pytest -v

      - name: Run Live Tests (Manual Trigger Only)
        if: ${{ github.event.inputs.run_live_tests == 'true' }}
        env:
          RUN_LIVE: 1
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pytest tests/live/ -v

  frontend-quality:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.relay.internal
          NEXT_PUBLIC_FIREBASE_API_KEY: dummy-key-for-ci
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: relay.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: relay
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: relay.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456789:web:abcdef"
        run: npm run build
